name: Publish QA services portfolio

on:
  push:
    branches: [qa-services-site]
    paths:
      - "qa-services-public/**"
      - ".github/workflows/publish-qa-services-public.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qa-services-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./qa-services-public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

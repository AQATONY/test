name: Publish QA portfolio

on:
  push:
    branches: [main]
    paths:
      - "qa-portfolio-2026/**"
      - ".github/workflows/qa-portfolio-2026-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./qa-portfolio-2026
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
